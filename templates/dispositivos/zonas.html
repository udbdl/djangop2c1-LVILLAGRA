{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Zonas de Consumo</h2>

{% if zonas %}
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for zona in zonas %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title fw-bold">{{ zona.nombre }}</h5>
                    <p class="card-text mb-1"><strong>Límite:</strong> {{ zona.limite_kwh }} kWh</p>
                    <p class="card-text"><strong>Dispositivos:</strong> {{ zona.cant_dispositivos }}</p>
                    <a href="{% url 'dispositivos:detalle_zona' zona.id %}" class="btn btn-primary w-100">Ver detalle</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info text-center" role="alert">
        No hay zonas disponibles.
    </div>
{% endif %}
{% endblock %}
